name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: secret-pattern scan (deterministic gate)
        run: |
          # public-record hygiene: fail on credential-shaped strings
          # (patterns written to be non-self-matching)
          ! grep -rIinE 'gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN[A-Z ]*PRIVATE|AKIA[A-Z0-9]{16}' --include='*' --exclude-dir=.git .

      - name: shell syntax check (bootstrap)
        run: bash -n bootstrap/bootstrap.sh

      - name: python syntax check (application code)
        run: |
          find . -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile
          echo "all python files compile"

      - name: compose config validation
        run: |
          found=0
          while IFS= read -r -d '' f; do
            docker compose -f "$f" config --quiet
            echo "OK: $f"
            found=$((found+1))
          done < <(find . \( -name 'compose.yaml' -o -name 'compose.yml' -o -name 'docker-compose.yaml' -o -name 'docker-compose.yml' \) -print0)
          [ "$found" -gt 0 ] || { echo "no compose files found"; exit 1; }

      - name: relative documentation links resolve
        run: |
          # documentation must not become fiction (master spec §52):
          # every relative markdown link must point at a real file
          broken=0
          while IFS=$'\t' read -r src link; do
            target="${src%/*}/${link#*#}"
            target="${target#./}"
            if [ ! -f "$target" ]; then
              echo "BROKEN: $src -> $link"
              broken=$((broken+1))
            fi
          done < <(grep -rIoE '\]\(([^)#h]+\.md)(#[^)]*)?\)' --include='*.md' . \
            | sed -E 's/^(.*):\]\(([^)#]+)(#[^)]*)?\)$/\1\t\2/')
          if [ "$broken" -gt 0 ]; then echo "$broken broken link(s)"; exit 1; fi
          echo "all relative doc links resolve"

      # ---- Helm validation (Phase 4) ----
      - name: install pinned helm (checksum-verified)
        run: |
          curl -fsSL -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          # verify against the official checksum published by the Helm project
          # for this exact pinned version (version is the pin; checksum is the
          # integrity gate; both fetched over TLS from get.helm.sh).
          # The .sha256sum file names the original tarball, so compare digests
          # directly rather than by filename.
          expected=$(curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" | awk '{print $1}')
          actual=$(sha256sum /tmp/helm.tgz | awk '{print $1}')
          echo "expected: $expected"
          echo "actual:   $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "CHECKSUM MISMATCH"; exit 1; }
          mkdir -p /tmp/helm && tar -xzf /tmp/helm.tgz -C /tmp/helm
          sudo mv /tmp/helm/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: helm lint (committed chart)
        run: helm lint platform/helm/platform-demo

      - name: helm template render + kubernetes manifest validation
        run: |
          helm template platform-demo platform/helm/platform-demo > /tmp/rendered.yaml
          # deterministic render output check: the render must be non-empty and valid YAML
          python3 - <<'EOF'
          import yaml, sys
          docs = list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
          docs = [d for d in docs if d]
          kinds = sorted(d['kind'] for d in docs)
          assert kinds == ['Deployment', 'Service'], f"unexpected kinds: {kinds}"
          print("rendered kinds:", kinds)
          EOF

      - name: chart/image reference consistency (pinned, no floating)
        run: |
          # the chart's pinned tag must match the application's compose-declared tag
          chart_tag=$(awk '/^  tag:/ {gsub(/"/,""); print $2}' platform/helm/platform-demo/values.yaml)
          compose_tag=$(awk '/image: platform-demo:/ {gsub(/.*platform-demo:/,""); print $1}' applications/platform-demo/compose.yaml)
          echo "chart tag: $chart_tag | compose tag: $compose_tag"
          [ -n "$chart_tag" ] && [ "$chart_tag" = "$compose_tag" ] || {
            echo "MISMATCH between chart image tag and compose image tag"; exit 1; }
          # no floating references anywhere in the chart
          ! grep -rE 'image:.*:(latest|\{\{.*tag.*latest)' platform/helm/ \
            || { echo "floating image reference found"; exit 1; }
          echo "chart/image consistency OK (pinned: $chart_tag)"

      - name: kubernetes manifest schema validation (kubeconform, pinned)
        run: |
          # cluster-less schema validation. kubectl --dry-run was rejected here:
          # it still requires an API server for OpenAPI. kubeconform validates
          # against upstream Kubernetes OpenAPI schemas offline.
          KUBECONFORM_VERSION=v0.8.0
          KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          mkdir -p /tmp/kc && tar -xzf /tmp/kubeconform.tgz -C /tmp/kc
          /tmp/kc/kubeconform -strict -summary /tmp/rendered.yaml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: build platform-demo image (reproducible from source)
        run: |
          docker build -t platform-demo:0.1.0 applications/platform-demo
          docker images platform-demo --format '{{.Repository}}:{{.Tag}} {{.ID}}'

      - name: run application container tests
        run: |
          # real application-level test: container must serve /health with expected payload
          docker run -d --name test-demo -p 8080:8080 platform-demo:0.1.0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status": "NOT-OK-BROKEN"' /tmp/health.json || { echo "health payload wrong"; docker logs test-demo; exit 1; }
          grep -q '"version": "0.1.0"' /tmp/health.json || { echo "version payload wrong"; exit 1; }
          # lifecycle: stop/start must preserve behavior
          docker stop test-demo && docker start test-demo && sleep 2
          curl -fsS http://localhost:8080/health | grep -q '"status": "ok"' \
            || { echo "restart broke health"; exit 1; }
          echo "application container tests PASSED"
          docker rm -f test-demo

      - name: upload rendered chart manifest (CI artifact)
        run: |
          helm template platform-demo platform/helm/platform-demo > rendered-manifest.yaml
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: rendered-manifest
          path: rendered-manifest.yaml
          retention-days: 7
