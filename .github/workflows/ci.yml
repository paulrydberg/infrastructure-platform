name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: secret-pattern scan (deterministic gate)
        run: |
          # public-record hygiene: fail on credential-shaped strings
          # (patterns written to be non-self-matching)
          ! grep -rIinE 'gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN[A-Z ]*PRIVATE|AKIA[A-Z0-9]{16}' --include='*' --exclude-dir=.git .

      - name: shell syntax check (bootstrap)
        run: bash -n bootstrap/bootstrap.sh

      - name: python syntax check (application code)
        run: |
          find . -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile
          echo "all python files compile"

      - name: compose config validation
        run: |
          found=0
          while IFS= read -r -d '' f; do
            docker compose -f "$f" config --quiet
            echo "OK: $f"
            found=$((found+1))
          done < <(find . \( -name 'compose.yaml' -o -name 'compose.yml' -o -name 'docker-compose.yaml' -o -name 'docker-compose.yml' \) -print0)
          [ "$found" -gt 0 ] || { echo "no compose files found"; exit 1; }

      - name: relative documentation links resolve
        run: |
          # documentation must not become fiction (master spec §52):
          # every relative markdown link must point at a real file
          broken=0
          while IFS=$'\t' read -r src link; do
            target="${src%/*}/${link#*#}"
            target="${target#./}"
            if [ ! -f "$target" ]; then
              echo "BROKEN: $src -> $link"
              broken=$((broken+1))
            fi
          done < <(grep -rIoE '\]\(([^)#h]+\.md)(#[^)]*)?\)' --include='*.md' . \
            | sed -E 's/^(.*):\]\(([^)#]+)(#[^)]*)?\)$/\1\t\2/')
          if [ "$broken" -gt 0 ]; then echo "$broken broken link(s)"; exit 1; fi
          echo "all relative doc links resolve"

      # ---- Helm validation (Phase 4) ----
      - name: install pinned helm (checksum-verified)
        run: |
          curl -fsSL -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          # verify against the official checksum published by the Helm project
          # for this exact pinned version (version is the pin; checksum is the
          # integrity gate; both fetched over TLS from get.helm.sh).
          # The .sha256sum file names the original tarball, so compare digests
          # directly rather than by filename.
          expected=$(curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" | awk '{print $1}')
          actual=$(sha256sum /tmp/helm.tgz | awk '{print $1}')
          echo "expected: $expected"
          echo "actual:   $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "CHECKSUM MISMATCH"; exit 1; }
          mkdir -p /tmp/helm && tar -xzf /tmp/helm.tgz -C /tmp/helm
          sudo mv /tmp/helm/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: helm lint (committed chart)
        run: helm lint platform/helm/platform-demo

      - name: helm template render + kubernetes manifest validation
        run: |
          helm template platform-demo platform/helm/platform-demo > /tmp/rendered.yaml
          # deterministic render output check: the render must be non-empty and valid YAML
          python3 - <<'EOF'
          import yaml, sys
          docs = list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
          docs = [d for d in docs if d]
          kinds = sorted(d['kind'] for d in docs)
          assert kinds == ['Deployment', 'Service'], f"unexpected kinds: {kinds}"
          print("rendered kinds:", kinds)
          EOF

      - name: chart/image reference consistency (pinned, no floating)
        run: |
          # the chart's pinned tag must match the application's compose-declared tag
          chart_tag=$(awk '/^  tag:/ {gsub(/"/,""); print $2}' platform/helm/platform-demo/values.yaml)
          compose_tag=$(awk '/image: platform-demo:/ {gsub(/.*platform-demo:/,""); print $1}' applications/platform-demo/compose.yaml)
          echo "chart tag: $chart_tag | compose tag: $compose_tag"
          [ -n "$chart_tag" ] && [ "$chart_tag" = "$compose_tag" ] || {
            echo "MISMATCH between chart image tag and compose image tag"; exit 1; }
          # no floating references anywhere in the chart
          ! grep -rE 'image:.*:(latest|\{\{.*tag.*latest)' platform/helm/ \
            || { echo "floating image reference found"; exit 1; }
          echo "chart/image consistency OK (pinned: $chart_tag)"

      - name: image-reference policy (Phase 7A deterministic CI validation)
        run: |
          # Policy: pinned version tags only; no floating refs; approved registry
          # set; digest awareness recorded. Enforcement stays OFF (evidence mode).
          violations=0
          # 1. no :latest anywhere in deployable manifests
          if grep -rnE 'image:.*:latest' platform/ applications/ 2>/dev/null; then
            echo "POLICY VIOLATION: floating :latest reference"; violations=$((violations+1))
          fi
          # 2. every image reference carries an explicit tag (not bare repo)
          bare=$(grep -rhoE 'image: [a-zA-Z0-9_/.-]+(:[a-zA-Z0-9._-]+)?' platform/ applications/             | grep -vE ':[a-zA-Z0-9._-]+$' || true)
          if [ -n "$bare" ]; then echo "POLICY VIOLATION: untagged image refs: $bare"; violations=$((violations+1)); fi
          # 3. approved registries: docker library images (official) + locally built
          unapproved=$(grep -rhoE 'image: [a-zA-Z0-9_/.-]+:[a-zA-Z0-9._-]+' platform/ applications/             | awk '{print $2}' | grep -vE '^(platform-demo:|[a-z0-9_.-]+/[a-z0-9_.-]*[a-z0-9_/-]*:)'             | grep -vE '^[a-z0-9_.-]+:[a-zA-Z0-9._-]+$' || true)
          # python:3.12-alpine3.20 = official docker hub library (allowed); anything
          # from a personal/unapproved namespace would be flagged here.
          if [ -n "$unapproved" ]; then echo "REVIEW: non-library registry refs: $unapproved"; fi
          # 4. pinned-digest awareness: record digest when the image exists locally (deployment env)
          echo "policy check complete: violations=$violations (documented in docs/07-security/security-baseline.md)"
          exit $violations

      - name: kubernetes manifest schema validation (kubeconform, pinned)
        run: |
          # cluster-less schema validation. kubectl --dry-run was rejected here:
          # it still requires an API server for OpenAPI. kubeconform validates
          # against upstream Kubernetes OpenAPI schemas offline.
          KUBECONFORM_VERSION=v0.8.0
          KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          mkdir -p /tmp/kc && tar -xzf /tmp/kubeconform.tgz -C /tmp/kc
          /tmp/kc/kubeconform -strict -summary /tmp/rendered.yaml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: build platform-demo image (reproducible from source)
        run: |
          docker build -t platform-demo:0.1.0 applications/platform-demo
          docker images platform-demo --format '{{.Repository}}:{{.Tag}} {{.ID}}'

      - name: run application container tests
        run: |
          # real application-level test: container must serve /health with expected payload
          docker run -d --name test-demo -p 8080:8080 platform-demo:0.1.0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status": "ok"' /tmp/health.json || { echo "health payload wrong"; docker logs test-demo; exit 1; }
          grep -q '"version": "0.1.0"' /tmp/health.json || { echo "version payload wrong"; exit 1; }
          # lifecycle: stop/start must preserve behavior
          docker stop test-demo && docker start test-demo && sleep 2
          curl -fsS http://localhost:8080/health | grep -q '"status": "ok"' \
            || { echo "restart broke health"; exit 1; }
          echo "application container tests PASSED"
          docker rm -f test-demo

      - name: upload rendered chart manifest (CI artifact)
        run: |
          helm template platform-demo platform/helm/platform-demo > rendered-manifest.yaml
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: rendered-manifest
          path: rendered-manifest.yaml
          retention-days: 7

  # ---- Phase 7A: CI security evidence (detect -> evidence -> baseline -> policy) ----
  # Principle: evidence first. This job does NOT gate the pipeline on findings;
  # it establishes the reproducible vulnerability/SBOM/secret baseline from
  # which a future policy stage will define thresholds (Stage 7B+ decision).
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: trivy vulnerability scan (pinned action + pinned scanner version)
        # Supply-chain note: aquasecurity/trivy-action tags <= 0.34.2 were
        # compromised 2026-03-19 (GHSA-69fq-xp46-6x23 / CVE-2026-33634,
        # malicious v0.69.4 CLI release, since removed upstream). We pin the
        # post-incident action v0.36.0 by verified commit SHA and explicitly
        # pin the scanner to v0.70.0 (released 2026-04-17; v0.69.4 verified
        # absent from the upstream release list).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: platform-demo:0.1.0
          format: table
          # exit-code 0: evidence collection, not enforcement (Stage 7B decision)
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          output: trivy-report.txt

      - name: trivy config scan (kubernetes manifests)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: platform/
          format: table
          exit-code: '0'
          output: trivy-config-report.txt

      - name: SBOM generation (SPDX, from the built image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: platform-demo:0.1.0
          format: spdx-json
          output: sbom-platform-demo.spdx.json

      - name: record image digest + SBOM identity
        run: |
          {
            echo "image: platform-demo:0.1.0"
            echo "digest: $(docker images platform-demo:0.1.0 --digests --format '{{.Digest}}')"
            echo "sbom-format: SPDX (spdx-json via trivy v0.70.0)"
            echo "generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "method: trivy image --format spdx-json (CI job, github-hosted runner)"
          } > sbom-metadata.txt
          # reproducibility note: SBOMs embed generation timestamps and are not
          # byte-reproducible; the identity chain (source -> pinned Dockerfile
          # -> digest -> SBOM) is the reproducible claim, not the file bytes.
          cat sbom-metadata.txt

      - name: gitleaks secret scan (pinned binary + checksum, deterministic)
        # The repo's existing grep-based pattern gate (validate job) stays as
        # the deterministic push-gate. Gitleaks adds entropy+ruleset coverage
        # beyond simple patterns. Binary pin follows the helm/kubeconform
        # discipline; the commercial gitleaks-action node bundle was REJECTED
        # (unvetted EULA-licensed bundle; binary + checksum is auditable).
        run: |
          GITLEAKS_VERSION=v8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p /tmp/gl && tar -xzf /tmp/gitleaks.tgz -C /tmp/gl
          chmod +x /tmp/gl/gitleaks
          # scan full git history; findings reported, not enforced (7B decision).
          # --redact keeps any matched secret text out of CI logs.
          /tmp/gl/gitleaks detect --source . --redact -v || true
          /tmp/gl/gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json || true
          echo "gitleaks scan complete (evidence mode)"

      - name: upload security evidence artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: security-evidence
          path: |
            trivy-report.txt
            trivy-config-report.txt
            sbom-platform-demo.spdx.json
            sbom-metadata.txt
            gitleaks-report.json
          retention-days: 30
          if-no-files-found: warn
